name: Publish denim rack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Copy the demo files
        run: |
          mkdir public
          base=https://denim-rack-motion-preview.spunkyjewel4.chatgpt.site
          curl -fsSL "$base/" -o public/index.html
          curl -fsSL "$base/rack.jpg" -o public/rack.jpg
          curl -fsSL "$base/rack.mp4" -o public/rack.mp4
          grep -q 'rack.mp4' public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
